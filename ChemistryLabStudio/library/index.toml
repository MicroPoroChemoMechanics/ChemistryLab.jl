#
# Published formulations, ready to load in ChemistryLab Studio (its Start tab).
#
# An entry holds choices only: the template of each material, its fraction,
# the degrees of reaction, the phase list. Every published number (oxide
# analyses, phase compositions) stays in ChemistryLab's data/literature files,
# which the templates read by name. An entry names the published works it rests
# on, each checked against Crossref and against the table its data come from.
#
# Only formulations published in a paper belong here.

[[entry]]
id = "cem1-52.5n-gruyaert2010"
title = "CEM I 52.5 N paste"
designation = "CEM I 52.5 N"
process = "equilibrium"
level = "novice"
sources = ["Gruyaert2010", "LothenbachWinnefeld2006"]
summary = "The CEM I 52.5 N of Gruyaert et al. (2010), by Bogue's calculation on its oxide analysis, at their water-to-binder ratio of 0.5, in the phases Lothenbach and Winnefeld (2006) list for a Portland paste. The degrees of reaction are illustrative values, to be set for the age of interest."

[entry.model]
version = 1
title = "CEM I 52.5 N paste"
database = "cemdata18-thermofun.json"
phase_list = "Portland paste (Lothenbach and Winnefeld 2006)"
activity_model = "cemdata18_KOH"
w_b = 0.5
temperature_c = 20.0
mode = "equilibrium"

[[entry.model.materials]]
template = "CEM I 52.5 N (Gruyaert 2010), Bogue"
fraction = 1.0
extents = [
    { constituent = "C3S", extent = 0.8 },
    { constituent = "C2S", extent = 0.45 },
    { constituent = "C3A", extent = 0.9 },
    { constituent = "C4AF", extent = 0.6 },
]

[[entry]]
id = "portland-rilem-pc"
title = "Portland cement paste, RILEM round robin"
designation = "PC, RILEM round robin"
process = "equilibrium"
level = "novice"
sources = ["Durdzinski2017", "LothenbachWinnefeld2006"]
summary = "The Portland cement of the RILEM round robin on blended cements, by Bogue's calculation on its oxide analysis (Durdzinski et al. 2017), in the phases Lothenbach and Winnefeld (2006) list for a Portland paste. Three minor oxides of this cement have no sourced density, so its volumes are unknown. The degrees of reaction are illustrative values."

[entry.model]
version = 1
title = "Portland cement paste"
database = "cemdata18-thermofun.json"
phase_list = "Portland paste (Lothenbach and Winnefeld 2006)"
activity_model = "cemdata18_KOH"
w_b = 0.45
temperature_c = 20.0
mode = "equilibrium"

[[entry.model.materials]]
template = "PC (Durdzinski 2017), Bogue"
fraction = 1.0
extents = [
    { constituent = "C3S", extent = 0.8 },
    { constituent = "C2S", extent = 0.45 },
    { constituent = "C3A", extent = 0.9 },
    { constituent = "C4AF", extent = 0.6 },
]
