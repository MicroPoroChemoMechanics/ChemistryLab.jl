<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">A miscibility gap: where one composition costs more than two</title>
  <desc id="desc">Left: a sketch of the molar Gibbs energy of an asymmetric binary solid solution, tilted by the standard potentials of its two end-members: the curve has two wells and a hump between its inflection points (the spinodal), and the common tangent touches it at two compositions, at two different heights; extended to x = 0 and x = 1, the tangent gives the chemical potentials of A and B, the same in the two coexisting compositions. Right: a composition inside the gap is cheaper as the two compositions of the tangent, in the proportions of the lever rule; the phase is declared twice, one instance on each.</desc>
