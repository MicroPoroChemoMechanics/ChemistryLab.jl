[[entry]]
id = "pc-siliceous-fly-ash-rilem-kinetics"
title = "Portland cement with 30 % siliceous fly ash in time, by rate laws"
designation = "PC + 30 % siliceous fly ash"
process = "kinetics"
level = "expert"
sources = ["Durdzinski2017", "Lavergne2018", "LothenbachWinnefeld2006"]
summary = "The paste PC-SFA of the RILEM round robin (Durdzinski et al. 2017) hydrating over 90 days at 20 °C: the clinker phases by the law of Parrott and Killoh, and the glass of the fly ash by the law of Waller with the set Lavergne et al. (2018) give for a fly ash, which was not fitted to this one, so that its degree of reaction is an illustration. The glass, known by its oxides, takes a formula written from them, and an enthalpy estimated from them. The quartz and the mullite stay inert."

[entry.model]
version = 2
title = "PC with 30 % siliceous fly ash, in time"
database = { kind = "builtin", name = "cemdata18-thermofun.json" }
system = { kind = "phase_list", phase_list = "Portland paste (Lothenbach and Winnefeld 2006)", add = ["Qtz"] }
activity = { kind = "cemdata18", electrolyte = "KOH" }
mix = { kind = "mix", w_b = 0.4, temperature = 20.0 }

[entry.model.calculation]
kind = "kinetics"
horizon = 90.0
ages = [1.0, 7.0, 28.0, 90.0]
calorimeter = { kind = "isothermal" }
rates = [
    { key = "C3S", value = { kind = "parrott_killoh_avrami" } },
    { key = "C2S", value = { kind = "parrott_killoh_avrami" } },
    { key = "C3A", value = { kind = "parrott_killoh_avrami" } },
    { key = "C4AF", value = { kind = "parrott_killoh_avrami" } },
    { key = "glass", value = { kind = "waller", preset = "fly_ash" } },
]

[[entry.model.materials]]
kind = "template"
template = "PC (Durdzinski 2017), Bogue"
fraction = 0.7
extents = []

[[entry.model.materials]]
kind = "template"
template = "siliceous fly ash (Durdzinski 2017)"
