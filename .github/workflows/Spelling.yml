name: Spelling

# Keeps the tree on the convention declared in `.spelling.json`.
#
# Why this runs server-side rather than only in a hook: a git hook lives in
# `.git/`, which is never cloned, and git deliberately refuses to let a
# repository install executable hooks on checkout. `core.hooksPath .githooks`
# is therefore opt-in, per clone, per person — a fresh clone, a collaborator,
# another machine or the GitHub web editor all bypass it. This job does not
# care where a commit came from, so it is the only place the rule can actually
# be guaranteed. The hook remains as fast local feedback, not as the guarantee.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  spelling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Read the configured convention
        id: cfg
        run: |
          conv=$(python3 -c "import json;print(json.load(open('.spelling.json'))['convention'])")
          echo "convention=$conv" >> "$GITHUB_OUTPUT"
          echo "Convention: $conv"

      - name: Check spelling
        run: python3 .github/scripts/spelling_tool.py check . --convention '${{ steps.cfg.outputs.convention }}'
