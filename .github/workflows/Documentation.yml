    #         using ChemistryLab
    #         DocMeta.setdocmeta!(ChemistryLab, :DocTestSetup, :(using ChemistryLab, DynamicQuantities, OrderedCollections, ModelingToolkit); recursive=true)
    #         doctest(ChemistryLab)
