name: Documentation
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  # The full build, and the only one that deploys. It runs on `main`, on tags and
  # on demand; a pull request is checked instead by the two jobs that follow it,
  # `preflight` and `pages`, which together cover every executed block and every
  # cross reference in a fraction of the wall time. Run this one by hand
  # (`workflow_dispatch`) on a branch when the rendered site itself is in doubt.
  build:
    #needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A bound keeps a hung build from occupying a runner indefinitely. It is a
    # safety net, NOT a capacity plan: when a build approaches this, the cause is
    # to be found rather than the number raised. One such cause is on record —
    # GR emits `GKS: glyph missing from current font` and the build stops there,
    # so the font is now pinned once in `docs/make.jl` and no page may override
    # it. A healthy build produces no such line.
    timeout-minutes: 240
    permissions:
        actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
        pull-requests: read
        contents: write
        statuses: write
    steps:
      # 1. Checkout the repository, with full history so `git tag` is complete:
      # DocumenterVitepress decides whether a tagged build also becomes `stable`
      # by looking for a higher release tag, and a shallow checkout sees none.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      # Node itself comes from NodeJS_20_jll, which the Julia depot cache above
      # already covers; this caches only what `npm install` fetches for the
      # VitePress build, keyed on the manifest that determines it.
      - uses: actions/cache@v4
        with:
          path: docs/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('docs/package.json') }}
          restore-keys: ${{ runner.os }}-npm-
      # The Pkg server intermittently advertises a General tree hash that its
      # CDN then answers with a 404, which kills the first `Pkg.add` of a cold
      # depot before any of this repository's code runs.  Install the registry
      # up front and fall back to a direct clone when that happens; package
      # tarballs keep going through the Pkg server either way.
      - name: Install the General registry
        shell: julia --color=yes {0}
        run: |
          using Pkg
          regdir = joinpath(first(DEPOT_PATH), "registries")
          if isdir(joinpath(regdir, "General")) || isfile(joinpath(regdir, "General.tar.gz"))
              @info "General registry already installed"
          else
              try
                  Pkg.Registry.add("General")
              catch err
                  @warn "Pkg server could not serve the registry; cloning from GitHub" err
                  withenv("JULIA_PKG_SERVER" => "") do
                      Pkg.Registry.add(Pkg.RegistrySpec(url = "https://github.com/JuliaRegistries/General.git"))
                  end
              end
          end
      - name: Install dependencies
        shell: julia --project=docs/ --color=yes {0}
        run: |
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
      # `JULIA_DEBUG=Documenter` makes Documenter name each page as it expands it.
      # Without it the whole `ExpandTemplates` stage — which is where every
      # `@example` block runs, and so nearly all the wall time — prints nothing
      # at all, and a build that is working normally is indistinguishable in the
      # log from one that has hung. That ambiguity cost two hours of runner time
      # once; the extra lines are worth it.
      - name: Build and deploy
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
            JULIA_DEBUG: Documenter
            # The coupled hydration trajectories are the bulk of the build: eight
            # 28-day integrations that share nothing with each other. Documenter
            # expands pages one at a time, so without threads they run strictly
            # in series. `warm_precomputed` in `scripts/precomputed.jl` puts each
            # page's own trajectories on the runner's cores instead. Measured on
            # two of them, on two threads: 1093.4 s serial against 593.2 s
            # together, and both results identical bit for bit.
            JULIA_NUM_THREADS: '4'
            # One thread per BLAS call, so the concurrency above is not
            # multiplied by a second layer competing for the same cores.
            OPENBLAS_NUM_THREADS: '1'
        run: julia --project=docs/ docs/make.jl

  # Pull requests, part one: the draft build of the WHOLE page tree, with every
  # `@example` skipped. It decides what no shard can -- the cross references
  # between pages, the page tree, the bibliography -- in minutes.
  preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
        actions: write # julia-actions/cache prunes the caches it created
        contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: actions/cache@v4
        with:
          path: docs/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('docs/package.json') }}
          restore-keys: ${{ runner.os }}-npm-
      # Same registry fallback as the build job, and for the same reason.
      - name: Install the General registry
        shell: julia --color=yes {0}
        run: |
          using Pkg
          regdir = joinpath(first(DEPOT_PATH), "registries")
          if isdir(joinpath(regdir, "General")) || isfile(joinpath(regdir, "General.tar.gz"))
              @info "General registry already installed"
          else
              try
                  Pkg.Registry.add("General")
              catch err
                  @warn "Pkg server could not serve the registry; cloning from GitHub" err
                  withenv("JULIA_PKG_SERVER" => "") do
                      Pkg.Registry.add(Pkg.RegistrySpec(url = "https://github.com/JuliaRegistries/General.git"))
                  end
              end
          end
      - name: Install dependencies
        shell: julia --project=docs/ --color=yes {0}
        run: |
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
      - name: Draft build (checks only)
        env:
            CHEMLAB_DOCS_PREFLIGHT_ONLY: '1'
        run: julia --project=docs/ docs/make.jl

  # Pull requests, part two: every page, built for real, in shards that run side
  # by side. The groups and the reason they are balanced the way they are live in
  # `docs/shards.jl`; a page no group names falls into `rest`. Each shard is a
  # partial build (`docs/partial.jl`), which demotes cross references to warnings
  # and refuses to deploy -- the references are the preflight's to check.
  pages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [cem4, binders, hydration, calibration, rest]
    permissions:
        actions: write # julia-actions/cache prunes the caches it created
        contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: actions/cache@v4
        with:
          path: docs/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('docs/package.json') }}
          restore-keys: ${{ runner.os }}-npm-
      # Same registry fallback as the build job, and for the same reason.
      - name: Install the General registry
        shell: julia --color=yes {0}
        run: |
          using Pkg
          regdir = joinpath(first(DEPOT_PATH), "registries")
          if isdir(joinpath(regdir, "General")) || isfile(joinpath(regdir, "General.tar.gz"))
              @info "General registry already installed"
          else
              try
                  Pkg.Registry.add("General")
              catch err
                  @warn "Pkg server could not serve the registry; cloning from GitHub" err
                  withenv("JULIA_PKG_SERVER" => "") do
                      Pkg.Registry.add(Pkg.RegistrySpec(url = "https://github.com/JuliaRegistries/General.git"))
                  end
              end
          end
      - name: Install dependencies
        shell: julia --project=docs/ --color=yes {0}
        run: |
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
      - name: Pages of shard ${{ matrix.shard }}
        shell: julia --color=yes {0}
        run: |
            # `pwd()`, not a bare relative path: this script runs from a
            # temporary file, and `include` resolves against the including file.
            include(joinpath(pwd(), "docs", "pages.jl"))
            include(joinpath(pwd(), "docs", "shards.jl"))
            sel = shard_pages("${{ matrix.shard }}", doc_page_leaves(pages))
            println(join(sel, "\n"))
            open(ENV["GITHUB_ENV"], "a") do io
                println(io, "CHEMLAB_DOCS_ONLY=", join(sel, ","))
            end
      - name: Build the pages of the shard
        env:
            JULIA_DEBUG: Documenter
            JULIA_NUM_THREADS: '4'
            OPENBLAS_NUM_THREADS: '1'
        run: julia --project=docs/ docs/make.jl

  # Doctests, in a job of their own and NOT inside the build above.
  #
  # `makedocs` runs them by default, so until now a one-line docstring example
  # could only fail after the whole site had been built -- two hours to learn
  # that a printed value had changed by a digit. `doctest = false` in
  # `docs/make.jl` turns that off, and this job is the other half of that pair:
  # the two must stay in step, or every doctest runs twice.
  #
  # It runs on `docs/` rather than on a lighter environment built by hand. A
  # doctest compares PRINTED OUTPUT, so it can pass under one Documenter and
  # fail under another, and pinning the version by hand here would be a second
  # place to keep in step with `docs/Project.toml` -- the very thing that let
  # the preamble drift while this job was commented out. Instantiating `docs/`
  # costs minutes against the build's hours, and it runs alongside it, not after.
  doctests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
        actions: write # julia-actions/cache prunes the caches it created
        contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      # Same registry fallback as the build job, and for the same reason: the
      # Pkg server intermittently advertises a tree hash its CDN answers with a
      # 404, which kills the first `Pkg.add` of a cold depot.
      - name: Install the General registry
        shell: julia --color=yes {0}
        run: |
          using Pkg
          regdir = joinpath(first(DEPOT_PATH), "registries")
          if isdir(joinpath(regdir, "General")) || isfile(joinpath(regdir, "General.tar.gz"))
              @info "General registry already installed"
          else
              try
                  Pkg.Registry.add("General")
              catch err
                  @warn "Pkg server could not serve the registry; cloning from GitHub" err
                  withenv("JULIA_PKG_SERVER" => "") do
                      Pkg.Registry.add(Pkg.RegistrySpec(url = "https://github.com/JuliaRegistries/General.git"))
                  end
              end
          end
      - name: Install dependencies
        shell: julia --project=docs/ --color=yes {0}
        run: |
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
      - name: Run doctests
        shell: julia --project=docs/ --color=yes {0}
        run: |
            using Documenter: doctest
            # The preamble shared with `docs/make.jl`, so the blocks run here
            # with exactly the modules they run with there.
            include(joinpath(pwd(), "docs", "doctest_setup.jl"))
            doctest(ChemistryLab)
