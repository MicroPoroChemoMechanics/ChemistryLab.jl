name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.part }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    # The suite runs in parts (`TEST_PARTS` in test/test_parts.jl), one job each.
    # Whole, it had grown to three hours on the coverage job and two on Windows,
    # canceled at five and a half when a release added tests; each part is a
    # fraction of that, and the parts are balanced on the time of every file,
    # which the timer printed at the end of each run reports. The coverage job
    # and Windows stay the slowest and get more room.
    timeout-minutes: ${{ ((matrix.version == '1' && matrix.os == 'ubuntu-latest') || matrix.os == 'windows-latest') && 150 || 120 }}
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          # Aliases, so that no release of Julia calls for an edit here: 'min' is
          # the latest patch of the oldest minor that `julia` admits in
          # Project.toml, '1' the latest release, which also measures the
          # coverage on ubuntu (keep it, or move the coverage conditions below
          # with it), and 'pre' the latest prerelease.
          - 'min'
          - '1'
          - 'pre'
        part:
          - core
          - equilibrium-1
          - equilibrium-2
          - kinetics-1
          - kinetics-2
        os:
          - ubuntu-latest
          # WINDOWS, on the current release only. What this job is here to catch
          # is platform-specific -- path separators, line endings, spawning a
          # child process, anything that assumes a POSIX filesystem -- and none
          # of that needs three Julia versions to show itself.
          #
          # `.gitattributes` normalizes the working tree to LF, so a `\r` cannot
          # reach the code that reads the bundled `.dat` databases.
          - windows-latest
        arch:
          - x64
        exclude:
          - os: windows-latest
            version: 'min'
          - os: windows-latest
            version: 'pre'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        id: julia
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      # One depot cache per Julia version and system, shared by the parts, which
      # install and precompile the same test environment. A cache per part, with
      # those of the documentation shards, would overflow the 10 GB a repository
      # may hold: the caches would evict each other and jobs start from a cold
      # depot, precompiling every dependency again. The key also names the
      # installed version, since the aliases of the matrix stay the same when
      # Julia changes: a new release starts its own depot instead of carrying the
      # old `compiled/` along.
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};version=${{ matrix.version }};julia=${{ steps.julia.outputs.julia-version }}
          include-matrix: false
      # The Pkg server intermittently advertises a General tree hash that its
      # CDN then answers with a 404, which kills the first `Pkg.add` of a cold
      # depot before any of this repository's code runs.  Install the registry
      # up front and fall back to a direct clone when that happens; package
      # tarballs keep going through the Pkg server either way.
      - name: Install the General registry
        shell: julia --color=yes {0}
        run: |
          using Pkg
          regdir = joinpath(first(DEPOT_PATH), "registries")
          if isdir(joinpath(regdir, "General")) || isfile(joinpath(regdir, "General.tar.gz"))
              @info "General registry already installed"
          else
              try
                  Pkg.Registry.add("General")
              catch err
                  @warn "Pkg server could not serve the registry; cloning from GitHub" err
                  withenv("JULIA_PKG_SERVER" => "") do
                      Pkg.Registry.add(Pkg.RegistrySpec(url = "https://github.com/JuliaRegistries/General.git"))
                  end
              end
          end
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          test_args: ${{ matrix.part }}
          # Instrument only the ubuntu jobs on the latest release: coverage
          # disables precompilation caching and would slow down every other
          # matrix entry for nothing.
          coverage: ${{ matrix.version == '1' && matrix.os == 'ubuntu-latest' }}
      # The coverage of the parts is merged before it is processed, into one
      # report. Processed part by part, a file that a part never runs counts every
      # executable line as missed, and the union Codecov takes of the reports then
      # flags the lines Julia never instruments wherever another part does run the
      # file. Each part keeps its raw `.cov` files instead, tagged with its name so
      # that two runners reusing a process id cannot overwrite each other's.
      - name: Tag the coverage files with the part
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        run: |
          find src ext -name '*.cov' -print0 |
            while IFS= read -r -d '' f; do mv "$f" "${f%.cov}.${{ matrix.part }}.cov"; done
      - uses: actions/upload-artifact@v7
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        with:
          name: coverage-${{ matrix.part }}
          path: |
            src/**/*.cov
            ext/**/*.cov
          if-no-files-found: error
          retention-days: 1
  extensions:
    # The extensions whose dependencies the suite does not load, tested in an
    # environment of their own (`test/extensions`) and measured with the rest:
    # SymbolicNumericIntegration brings some fifty packages, ModelingToolkitBase
    # among them, that the parts have no use for.
    name: Extensions the suite does not load
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        id: julia
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};julia=${{ steps.julia.outputs.julia-version }}
      - name: Test the extensions the suite does not load
        run: julia --color=yes --code-coverage=@"$GITHUB_WORKSPACE/ext" --project=test/extensions -e 'using Pkg; Pkg.instantiate(); include("test/extensions/runtests.jl")'
      - name: Tag the coverage files
        run: |
          find ext -name '*.cov' -print0 |
            while IFS= read -r -d '' f; do mv "$f" "${f%.cov}.extensions.cov"; done
      # Two search paths, as in the parts, although only `ext/` holds counts here:
      # an artifact keeps the hierarchy below the least common ancestor of its
      # search paths, so `ext/**/*.cov` alone stored the files without their
      # `ext/` prefix, the merge put them at the root, and the processing, which
      # reads `src/` and `ext/`, counted the extension as never run.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-extensions
          path: |
            src/**/*.cov
            ext/**/*.cov
          if-no-files-found: error
          retention-days: 1
  coverage:
    name: Coverage
    needs: [test, extensions]
    # Runs once the matrix is done, whatever its outcome, and uploads only when
    # every part and the extensions produced coverage, which they do only when
    # their tests pass: a report lacking one would show the lines only it runs as
    # missed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # the artifacts of the test jobs
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-parts
      - name: Merge the parts
        id: merge
        run: |
          # The values of `matrix.part` above, plus the extensions.
          expected=6
          n=$(find coverage-parts -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$n" -eq "$expected" ]; then
            for d in coverage-parts/*/; do cp -r "$d". .; done
            echo "complete=true" >> "$GITHUB_OUTPUT"
          elif [ "$n" -eq 0 ]; then
            # Either every job failed, or none satisfies the coverage conditions
            # any more, which would otherwise go unnoticed.
            echo "::error::no job produced coverage"
            exit 1
          else
            echo "::warning::coverage from $n of the $expected jobs: nothing uploaded"
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
      # Not julia-actions/julia-processcoverage: see the header of the script
      # for why its `amend_coverage_from_src!` step misreports this package.
      - name: Process coverage
        if: steps.merge.outputs.complete == 'true'
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(; temp = true)
          Pkg.add("Coverage")
          # `pwd()` is the workspace root.  An absolute path is required: the
          # `run:` block is written to a temp file by the runner, and `include`
          # resolves relative to THAT file's directory, not the cwd.
          include(joinpath(pwd(), ".github", "scripts", "coverage.jl"))
      - uses: codecov/codecov-action@v7
        if: steps.merge.outputs.complete == 'true'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
