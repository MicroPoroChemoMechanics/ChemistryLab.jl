name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    # The coverage job instruments every line and runs without the
    # precompilation cache, which makes it the slowest by far: 49 and 55 minutes
    # on the two runs of 0.25.0, and past 60 on 0.25.1, where it was
    # canceled at the limit while the three other jobs passed. It had two
    # hours, which 0.33.0 reached: 88 and 118 minutes on two runs of the same
    # commit, canceled at 120 on a third, before the durability pages of 0.34.0
    # added their tests. It gets three. The others had one, until the suite of
    # 0.29.0 took 56 and 58 minutes on Linux (1.13, pre) and Windows was
    # canceled at the limit, then an hour and a half, which Windows reached
    # within five minutes on 0.33.0; they get two, which still stops a hung run
    # early. Windows gets three as well: the same source of 0.37.0 took 68
    # minutes on one run and was canceled at 120 on the next.
    timeout-minutes: ${{ ((matrix.version == '1.12' && matrix.os == 'ubuntu-latest') || matrix.os == 'windows-latest') && 180 || 120 }}
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          - '1.13'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
        include:
          # WINDOWS, on the current release only. What this job is here to catch
          # is platform-specific -- path separators, line endings, spawning a
          # child process, anything that assumes a POSIX filesystem -- and none
          # of that needs three Julia versions to show itself. One job rather
          # than three, because a Windows runner minute costs several Linux ones.
          #
          # `.gitattributes` normalizes the working tree to LF, so a `\r` cannot
          # reach the code that reads the bundled `.dat` databases.
          - version: '1.13'
            os: windows-latest
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # The Pkg server intermittently advertises a General tree hash that its
      # CDN then answers with a 404, which kills the first `Pkg.add` of a cold
      # depot before any of this repository's code runs.  Install the registry
      # up front and fall back to a direct clone when that happens; package
      # tarballs keep going through the Pkg server either way.
      - name: Install the General registry
        shell: julia --color=yes {0}
        run: |
          using Pkg
          regdir = joinpath(first(DEPOT_PATH), "registries")
          if isdir(joinpath(regdir, "General")) || isfile(joinpath(regdir, "General.tar.gz"))
              @info "General registry already installed"
          else
              try
                  Pkg.Registry.add("General")
              catch err
                  @warn "Pkg server could not serve the registry; cloning from GitHub" err
                  withenv("JULIA_PKG_SERVER" => "") do
                      Pkg.Registry.add(Pkg.RegistrySpec(url = "https://github.com/JuliaRegistries/General.git"))
                  end
              end
          end
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # Instrument only the primary job: coverage disables precompilation
          # caching and would slow down every other matrix entry for nothing.
          coverage: ${{ matrix.version == '1.12' && matrix.os == 'ubuntu-latest' }}
      # Not julia-actions/julia-processcoverage: see the header of the script
      # for why its `amend_coverage_from_src!` step misreports this package.
      - name: Process coverage
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(; temp = true)
          Pkg.add("Coverage")
          # `pwd()` is the workspace root.  An absolute path is required: the
          # `run:` block is written to a temp file by the runner, and `include`
          # resolves relative to THAT file's directory, not the cwd.
          include(joinpath(pwd(), ".github", "scripts", "coverage.jl"))
      - uses: codecov/codecov-action@v7
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false