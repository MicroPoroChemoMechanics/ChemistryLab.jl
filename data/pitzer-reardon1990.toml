# Pitzer ion-interaction parameters for cement/water systems, 25 °C.
#
# Source: E. J. Reardon, "An ion interaction model for the determination of
# chemical equilibria in cement/water systems", Cement and Concrete Research
# 20, 175-192 (1990), doi:10.1016/0008-8846(90)90070-e. Tables 2 to 6.
#
# Reardon states that his tables are "precisely as given by Harvie et al." --
# Harvie, Moller & Weare, Geochimica et Cosmochimica Acta 48(4), 723-751
# (1984), doi:10.1016/0016-7037(84)90098-x -- with three exceptions he names:
# the Na-HCO3 and Na-CO3 parameters follow a review by Monnin & Schott, the
# H-SO4 parameters come from Reardon & Beckie, and the silicate, aluminate and
# ferrate ions have no published data at all.
#
# THE SILICATE, ALUMINATE AND FERRATE PARAMETERS ARE ESTIMATES, NOT
# MEASUREMENTS. Reardon says which analog each one borrows: HSO4- serves as
# the model for Fe(OH)4-, Al(OH)4- and H3SiO4-, SO4-2 for H2SiO4-2, and H2CO3@
# for H4SiO4@. Every affected entry carries `origin = "estimated:<analog>"`
# below, because a caller reading beta0 for Al(OH)4- would otherwise have no
# way of knowing that no aluminate solution was ever measured to obtain it.
#
# Transcription. Table 2 was transcribed and then verified against the PDF
# text layer: all 216 values matched, with the only surplus tokens on the PDF
# side being OCR fragments of the Greek symbols. Tables 5 and 6 could NOT be
# verified that way -- that text layer mangles values, turning one -0.0677
# into -0.0077 and dropping two others -- so they were read from the rendered
# pages at 6x magnification instead.
#
# A missing binary entry is an error, not a zero: see `PitzerParameters`.
# A missing theta, psi or lambda is zero, which is the convention of the
# literature these tables come from.

[meta]
name = "Reardon 1990 cement/water ion interaction parameters"
temperature_K = 298.15
source_doi = "10.1016/0008-8846(90)90070-e"
upstream_doi = "10.1016/0016-7037(84)90098-x"
# The set assumes a FULLY DISSOCIATED speciation: the association of Ca with
# SO4, of Na with OH and so on is absorbed into these parameters, so a species
# list that also carries ion pairs such as `Ca(SO4)@` or `CaOH+` counts the
# same association twice.
speciation = "dissociated"

