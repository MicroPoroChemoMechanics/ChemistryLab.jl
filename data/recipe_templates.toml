# Materials of published mixes, for `material_template(name, species)`.
#
# This file holds references and choices only. Every number (oxide analyses,
# phase compositions) is read from data/literature/<key>.json when the material
# is built, so that no published value is copied here. The extents of a real mix
# are the caller's: every constituent below reacts completely unless the entry
# says otherwise, and `with_extents` sets them.
#
# Sources
#   Durdzinski2017 : the TC 238-SCM round robin, Table 1 (XRF and XRD-Rietveld)

# The Portland cement of the round robin, twice: by its Rietveld phases (the
# crystals the database holds, the others entered by their oxides, see
# `ChemistryLab.RIETVELD_PHASES`), and by Bogue's calculation on its oxide
# analysis. The two budgets differ, and the difference is what the choice of
# route costs.
[[material]]
name   = "PC (Durdzinski 2017), phases"
kind   = "cement"
phases = "Durdzinski2017:phase_composition:PC"
source = "Durdzinski2017"

[[material]]
name     = "PC (Durdzinski 2017), Bogue"
kind     = "cement"
analysis = "Durdzinski2017:chemical_composition:PC"
route    = "bogue"
sulfate  = "Anh"   # the Rietveld analysis of this cement finds anhydrite, no gypsum
source   = "Durdzinski2017"

# The two ground granulated blast-furnace slags: glasses, known by their oxides.
[[material]]
name     = "S1 slag (Durdzinski 2017)"
kind     = "scm"
analysis = "Durdzinski2017:chemical_composition:S1"
route    = "oxides"
source   = "Durdzinski2017"

[[material]]
name     = "S2 slag (Durdzinski 2017)"
kind     = "scm"
analysis = "Durdzinski2017:chemical_composition:S2"
route    = "oxides"
source   = "Durdzinski2017"

# The calcareous fly ash by its Rietveld analysis, the amorphous part its glass
# by difference from the XRF analysis.
[[material]]
name     = "calcareous fly ash (Durdzinski 2017)"
kind     = "scm"
phases   = "Durdzinski2017:phase_composition:CFA"
analysis = "Durdzinski2017:chemical_composition:CFA"
source   = "Durdzinski2017"

# The siliceous fly ash: its quartz and mullite, inert, and its glass by
# difference from the XRF analysis, which is the part that reacts.
[[material]]
name        = "siliceous fly ash (Durdzinski 2017)"
kind        = "scm"
analysis    = "Durdzinski2017:chemical_composition:SFA"
crystalline = "Durdzinski2017:phase_composition:SFA"
source      = "Durdzinski2017"

#   DeWeerdt2011   : the clinker, fly ash and limestone of De Weerdt et al.
#                    (2011), Tables 1 to 3 (XRF, XRD-Rietveld, TGA)

# The clinker by its Rietveld phases, what its analysis holds beyond them (free
# lime, alkalis, magnesia, sulfate) as its minor oxides.
[[material]]
name      = "clinker (De Weerdt 2011)"
kind      = "cement"
phases    = "DeWeerdt2011:mineral_composition:clinker"
analysis  = "DeWeerdt2011:chemical_composition:clinker"
remainder = true
source    = "DeWeerdt2011"

# The class F siliceous fly ash: quartz, mullite, hematite, calcite and
# anhydrite, inert, and its glass by difference from the XRF analysis.
[[material]]
name        = "siliceous fly ash (De Weerdt 2011)"
kind        = "scm"
analysis    = "DeWeerdt2011:chemical_composition:fly ash"
crystalline = "DeWeerdt2011:mineral_composition:fly ash"
source      = "DeWeerdt2011"

# The limestone powder: its calcite (by TGA), and what its analysis holds beyond
# it, which a mix leaves unreacted.
[[material]]
name      = "limestone (De Weerdt 2011)"
kind      = "scm"
phases    = "DeWeerdt2011:mineral_composition:limestone"
analysis  = "DeWeerdt2011:chemical_composition:limestone"
remainder = true
source    = "DeWeerdt2011"

#   Shi2016        : the white Portland cement, limestone and metakaolin of Shi
#                    et al. (2016), Table 1 and Section 2.1 (XRF, 29Si NMR)

# The white Portland cement (CEM I 52.5 N): alite and belite by NMR, the
# aluminate by mass balance, gypsum, calcite and free lime, and no ferrite (its
# iron sits in the other phases). Counted with their pure formulas, those phases
# leave 1.3 % of the cement for a magnesia, alkalis and sulfate the analysis
# gives at 3.9 %; the minor oxides are kept as analyzed and the phases scaled
# down to make room, which also brings their lime to that of the analysis.
[[material]]
name      = "white Portland cement (Shi 2016)"
kind      = "cement"
phases    = "Shi2016:phase_composition:wPc"
analysis  = "Shi2016:chemical_composition:wPc"
remainder = "analysis"
source    = "Shi2016"

# The limestone, a chalk: its calcite, and what its analysis holds beyond it.
[[material]]
name      = "limestone (Shi 2016)"
kind      = "scm"
phases    = "Shi2016:phase_composition:LS"
analysis  = "Shi2016:chemical_composition:LS"
remainder = true
source    = "Shi2016"

# The metakaolin, by its analysis alone.
[[material]]
name     = "metakaolin (Shi 2016)"
kind     = "scm"
analysis = "Shi2016:chemical_composition:MK"
route    = "oxides"
source   = "Shi2016"

#   Gruyaert2010   : the CEM I 52.5 N and the blast-furnace slag of Gruyaert et
#                    al. (2010), Table 1 (XRF and Blaine), the batch of the
#                    calorimetry

# The cement by Bogue's calculation on its analysis: the article reports no
# phase composition and no alkali.
[[material]]
name     = "CEM I 52.5 N (Gruyaert 2010), Bogue"
kind     = "cement"
analysis = "Gruyaert2010:oxides:OPC-CAL"
route    = "bogue"
source   = "Gruyaert2010"

[[material]]
name     = "blast-furnace slag (Gruyaert 2010)"
kind     = "scm"
analysis = "Gruyaert2010:oxides:BFS-CAL"
route    = "oxides"
source   = "Gruyaert2010"

#   Scholer2015    : the OPC, blast-furnace slag, siliceous fly ash and limestone
#                    of Schöler et al. (2015), Tables 1 and 2 (XRF, XRD-Rietveld)

# The OPC by its Rietveld phases, the magnesia, alkalis and sulfate of its
# analysis that the phases do not hold kept as analyzed, the phases scaled down
# to make room.
[[material]]
name      = "OPC (Schöler 2015)"
kind      = "cement"
phases    = "Scholer2015:phases:OPC"
analysis  = "Scholer2015:oxides:OPC"
remainder = "analysis"
source    = "Scholer2015"

# The slag: its few crystals, and its glass by difference from the XRF analysis,
# which the authors estimate the same way (their Table 3).
[[material]]
name     = "blast-furnace slag (Schöler 2015)"
kind     = "scm"
phases   = "Scholer2015:phases:BFS"
analysis = "Scholer2015:oxides:BFS"
source   = "Scholer2015"

# The siliceous fly ash: mullite, quartz, maghemite and the rest of its crystals,
# inert, and its glass by difference.
[[material]]
name        = "siliceous fly ash (Schöler 2015)"
kind        = "scm"
analysis    = "Scholer2015:oxides:FA"
crystalline = "Scholer2015:phases:FA"
source      = "Scholer2015"

# The limestone by its analysis alone: 99.1 % calcite, which the minimization
# forms again, and an illite, whose composition is not a fixed formula.
[[material]]
name     = "limestone (Schöler 2015)"
kind     = "scm"
analysis = "Scholer2015:oxides:LS"
route    = "oxides"
source   = "Scholer2015"
