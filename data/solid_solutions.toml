# Solid solution phases for ChemistryLab.jl
#
# Each [[solid_solution]] entry defines one SolidSolutionPhase:
#   name        – name of the phase
#   end_members – symbols of species in the database (must have AS_CRYSTAL)
#   model       – mixing model: "ideal" | "redlich_kister" | "regular"
#   a0, a1, a2  – Redlich-Kister parameters (J/mol), only for model = "redlich_kister"
#   guggenheim  – instead of a0 and a1: "<literature key>:<pair>", published
#                 dimensionless parameters read from data/literature, a = α R T
#                 at 298.15 K
#   instances   – how many coexisting compositions the phase may take; 2 for a
#                 model that unmixes, which is refused otherwise
#   w           – single interaction parameter (J/mol) of a binary "regular"
#   W           – full symmetric interaction matrix (J/mol), rows, for a
#                 multi-component "regular" solution of any arity
#   database    – the database file the end members exist in, for an entry
#                 that no other database can build; skipped without a warning
#                 when that database is not the one loaded
#   source      – literature reference
#
# Sources
#   Lothenbach2019 : Lothenbach et al., Cement and Concrete Research 115 (2019) 472-506
#   Lothenbach2015 : Lothenbach & Nonat, Cement and Concrete Research 78 (2015) 57-70
#
# NOTE — this file is not the CEMDATA18/GEM-Selektor phase model, and is not
# meant to be. `CSHQ`, `C3(AF)S0.84H`, `AFm_SO4_OH` and `AFt_SO4_CO3` below match
# the GEMS phases, but `Hydrogarnet` and `Hydrotalcite` are deliberate
# alternatives: GEMS treats `C3AH6`, `C3FH6` and `hydrotalcite` as *pure* phases,
# and its hydrotalcite solid solution (`hydrotalc-pyro`) is `Mg3AlC0.5OH` +
# `Mg3FeC0.5OH` at Mg:Al = 3. Anyone reproducing a GEMS result should declare
# the phases in the script rather than take this file wholesale. Monosulfate and
# monocarbonate are pure phases in Cemdata18, and this file does not mix them.

# ── C-S-H gel (CSHQ) — 6 end-members, ideal mixing ───────────────────────────
# `KSiOH` = ((KOH)2.5SiO2H2O)0.2 and `NaSiOH` = ((NaOH)2.5SiO2H2O)0.2 are the
# alkali-uptake end-members of the CEMDATA18 CSHQ phase, and they are the
# mechanism that fixes the pore-solution pH of a real paste. In the reference
# GEM-Selektor run of a CEM I at w/c = 0.5 they hold 74 % of the total potassium
# and 90 % of the total sodium; leaving them out strands all of it in solution.
# They were absent here until 0.15.0 although both are fully parameterized in
# both shipped databases. Their records name their own sources as the GEMS keys
# `Lothenbach_ea_b:2012` and `Robie_Hem:1995`; the second is USGS Bulletin 2131
# (doi:10.3133/b2131), the first is ambiguous between two 2012 Cement and
# Concrete Research papers with Lothenbach as first author and the shipped
# database carries no reference list to settle it, so the parameters are cited
# to Cemdata18 itself (Lothenbach2019).
[[solid_solution]]
name        = "CSHQ"
end_members = ["CSHQ-TobD", "CSHQ-TobH", "CSHQ-JenH", "CSHQ-JenD",
               "KSiOH", "NaSiOH"]
model       = "ideal"
source      = "Lothenbach2015"

# ── C-S-H gel with a chloride end member (CSHQ_Cl) — 7 end-members, ideal ────
# CSHQ with `CSHQ-Cl` = (CaCl2)0.5, an end member whose Gibbs
# energy ChemistryLab fitted on the chloride bound by C-S-H in the sorption
# tests of Hirao et al. (2005); data/chloride/README.md says how, and what it
# does not describe. It ships in data/cemdata18-chloride.json alone, so the
# phase is built from that database only. CSHQ above is unchanged, and the two
# describe one gel: declare one of them.
[[solid_solution]]
name        = "CSHQ_Cl"
end_members = ["CSHQ-TobD", "CSHQ-TobH", "CSHQ-JenH", "CSHQ-JenD",
               "KSiOH", "NaSiOH", "CSHQ-Cl"]
model       = "ideal"
database    = "cemdata18-chloride.json"
source      = "Hirao2005"

# ── Fe-siliceous hydrogarnet — binary ideal ──────────────────────────────────
# The GEMS `C3(AF)S0.84H` phase: the Al and Fe end-members of the siliceous
# hydrogarnet, which is where the iron of a CEM I ferrite phase ends up. It
# takes 0.0507 mol in the reference run, second only to the C-S-H and the
# portlandite among the aluminate/ferrite hydrates.
[[solid_solution]]
name        = "C3(AF)S0.84H"
end_members = ["C3AFS0.84H4.32", "C3FS0.84H4.32"]
model       = "ideal"
source      = "Lothenbach2019"

# ── Hydrogarnet (C3AH6 / C3FH6) — binary ideal ───────────────────────────────
[[solid_solution]]
name        = "Hydrogarnet"
end_members = ["C3AH6", "C3FH6"]
model       = "ideal"
source      = "Lothenbach2019"

# ── Ettringite solid solution ─────────────────────────────────────────────────
[[solid_solution]]
name        = "Ettringite_ss"
end_members = ["ettringite", "ettringite30"]
model       = "ideal"
source      = "Lothenbach2019"

# ── Hydrotalcite (OH/CO3) — binary ideal ─────────────────────────────────────
# Likewise "Ht_OH"/"Ht_CO3" exist in neither database. The pair below is the
# OH/CO3 couple at matching Mg:Al = 2, which is what a binary solid solution
# requires: hydrotalcite is Mg4Al2O7(H2O)10 and Mg2AlC0.5OH is
# Mg2Al(OH)6(CO3)0.5(H2O)2. The database also carries Mg3AlC0.5OH at Mg:Al = 3,
# which would not pair consistently.
[[solid_solution]]
name        = "Hydrotalcite"
end_members = ["hydrotalcite", "Mg2AlC0.5OH"]
model       = "ideal"
source      = "Lothenbach2019"

# ── The remaining CEMDATA18 solid solutions ──────────────────────────────────
#
# The five below complete the set of multi-end-member phases a GEM-Selektor
# CEMDATA18 run of a Portland cement is given. Their end-members are all in both
# shipped databases. Three are ideal, and that is **assumed**; `AFm_SO4_OH` and
# `AFt_SO4_CO3` carry the non-ideal parameters CEMDATA18 gives them (Table 1,
# notes g and a), read from data/literature/Lothenbach2019.json. With them each
# of the two unmixes, so a single composition is no longer its equilibrium, and
# both are declared with two instances; the `miscibility_gap` example shows what
# that takes.
#
# Two things measured on a CEM I paste at w/c = 0.5, worth knowing before
# loading all of them:
#
#   * All five are UNDERSATURATED there — GEM-Selektor reports LogSI of -2.883
#     (straetlingite), -1.000 (SO4_OH_AFm), -0.032 (SO4_CO3_AFt), -9.981
#     (hydrotalc-pyro) and -3.784 (MSH). A binary ideal solid solution gains at
#     most log10(2) = 0.301 over its best pure end-member, so mixing cannot
#     bring any of them in, and leaving them out costs nothing on that problem.
#   * A solid solution whose every end-member sits at the solver's lower bound
#     is numerically awkward: the mole fractions, and hence the log-activity
#     terms, are indeterminate there. Reaktoro fails to converge when any single
#     one of these five is declared on that paste.
#
# GEMS also carries `OH_SO4_AFm` and `CO3_SO4_AFt`, which repeat `SO4_OH_AFm` and
# `SO4_CO3_AFt` with the two end-member roles swapped. That is how GEMS opens a
# miscibility gap — two identical binaries, so two immiscible compositions can
# coexist. Here the same is asked for with `instances = 2`, and it is inert
# unless the gap actually opens.

# Straetlingite, two hydration states (C2ASH8 / C2ASH7).
[[solid_solution]]
name        = "Straetlingite_ss"
end_members = ["straetlingite", "straetlingite7"]
model       = "ideal"
source      = "Lothenbach2019"

# AFm, the SO4/OH couple of Cemdata18: C4AH13 against monosulfate, non-ideal
# with the Guggenheim parameters of its Table 1, note g, read from
# data/literature/Lothenbach2019.json. With C4AH13 first they give the gap the
# article prints, X(OH) from 0.50 to 0.97, hence two instances. Cemdata18 has no
# monosulfate-monocarbonate solid solution: those two are pure phases.
[[solid_solution]]
name        = "AFm_SO4_OH"
end_members = ["C4AH13", "monosulphate12"]
model       = "redlich_kister"
guggenheim  = "Lothenbach2019:AFm SO4/OH"
instances   = 2
source      = "Lothenbach2019"

# AFt, the SO4/CO3 couple, normalised per mole of sulfate: `ettringite03_ss` is
# (SO4)Ca2Al0.6666667(OH)4(H2O)8.6666667, exactly ettringite/3, and
# `tricarboalu03` is its carbonate analog. Declaring this alongside
# `Ettringite_ss` double-counts the same aluminate sulfate — pick one.
# Non-ideal with the parameters of Table 1, note a, downscaled by the article
# to a 1 CO2 : 1 SO3 replacement, which is this per-sulfate normalization. With
# the carbonate first they give the printed gap, X(SO4) from 0.10 to 0.55.
[[solid_solution]]
name        = "AFt_SO4_CO3"
end_members = ["tricarboalu03", "ettringite03_ss"]
model       = "redlich_kister"
guggenheim  = "Lothenbach2019:AFt SO4/CO3"
instances   = 2
source      = "Lothenbach2019"

# AFt, the Al/Fe couple: `ettringite05` and `Fe-ettringite05` are ettringite
# and Fe-ettringite per mole of Al or Fe, the formula units the parameters of
# Table 1, note b, are applied to (the CEMDATA18 cement export published with
# xGEMS applies them to these two members, in this order). With Al first they
# give the gap the article prints, X(Al) from 0.25 to 0.65, hence two instances.
# Declaring this alongside a pure ettringite, or another AFt solution, counts the
# same aluminate sulfate twice — pick one.
[[solid_solution]]
name        = "AFt_AlFe"
end_members = ["ettringite05", "Fe-ettringite05"]
model       = "redlich_kister"
guggenheim  = "Lothenbach2019:AFt Al/Fe"
instances   = 2
source      = "Lothenbach2019"

# AFm, the Al/Fe couple of monosulfate, per mole of Al or Fe, with the
# parameters of Table 1, note h: with Al first, the printed gap X(Al) from 0.45
# to 0.95. The same caution applies alongside `AFm_SO4_OH`.
[[solid_solution]]
name        = "AFm_AlFe"
end_members = ["monosulphate1205", "Fe-monosulph05"]
model       = "redlich_kister"
guggenheim  = "Lothenbach2019:AFm Al/Fe"
instances   = 2
source      = "Lothenbach2019"

# Hydrotalcite-pyroaurite, the Al/Fe couple at Mg:Al = 3. Distinct from the
# `Hydrotalcite` entry above, which is the OH/CO3 couple at Mg:Al = 2.
[[solid_solution]]
name        = "Hydrotalcite_AlFe"
end_members = ["Mg3AlC0.5OH", "Mg3FeC0.5OH"]
model       = "ideal"
source      = "Lothenbach2019"

# MgAl-OH-LDH, hydrotalcite-like phases of Mg/Al 2 to 4 (Cemdata18, Table 3,
# note **): an ideal ternary, tentative, recommended for alkali-activated
# materials. For a Portland cement the paper recommends M4AH10 alone. M6A is the
# average of M4A and M8A in composition and, to 0.3 J/mol, in Gibbs energy,
# which the degeneracy guard of `SolidSolutionPhase` reports; the entry keeps
# the model as published.
[[solid_solution]]
name        = "MgAl_OH_LDH"
end_members = ["M4A-OH-LDH", "M6A-OH-LDH", "M8A-OH-LDH"]
model       = "ideal"
acknowledge_degenerate = true
source      = "Lothenbach2019"

# M-S-H, two Mg/Si ratios.
[[solid_solution]]
name        = "MSH"
end_members = ["M075SH", "M15SH"]
model       = "ideal"
source      = "Lothenbach2019"

# ── The other C-S-H models of Cemdata18 ────────────────────────────────────
#
# Sources
#   Lothenbach2019 : Cemdata18, Table 4 and Section 4.1 -- the end-members and
#                    the statement that each of these models, in the downscaled
#                    form the database stores, is ideal
#   Kulik2011      : the CSH3T model (Section 4.2) and the ECSH families
#
# Alternatives to `CSHQ` and `CNASH_ss`, for one gel: declare one C-S-H model
# per system (see data/gel_models.toml, which refuses two together). CSH3T is
# defined by Kulik as ideal mixing on two bridging-tetrahedral sites; on the
# half formula units of the database records that mixing is close to ideal
# mixing of the end-members, which is the form Cemdata18 ships. The site form is
# `sublattice_model("Kulik2011:csh3t", members)`.
[[solid_solution]]
name        = "CSH3T"
end_members = ["CSH3T-TobH", "CSH3T-T5C", "CSH3T-T2C"]
model       = "ideal"
source      = "Lothenbach2019"

[[solid_solution]]
name        = "ECSH1"
end_members = ["ECSH1-TobCa", "ECSH1-SH", "ECSH1-NaSH", "ECSH1-KSH", "ECSH1-SrSH"]
model       = "ideal"
source      = "Lothenbach2019"

[[solid_solution]]
name        = "ECSH2"
end_members = ["ECSH2-TobCa", "ECSH2-JenCa", "ECSH2-NaSH", "ECSH2-KSH", "ECSH2-SrSH"]
model       = "ideal"
source      = "Lothenbach2019"

# ── C-(N-)A-S-H — the alkali- and aluminum-bearing C-S-H ─────────────────────
#
# Sources
#   Myers2014 : Myers, Bernal & Provis, "A thermodynamic model for C-(N-)A-S-H
#               gel: CNASH_ss. Derivation and validation against experimental
#               data", Cement and Concrete Research 66 (2014) 27-47,
#               doi:10.1016/j.cemconres.2014.07.005
#
# This is the phase a blended cement needs and `CSHQ` cannot supply. CSHQ has no
# aluminum end-member at all, so the Al released by a slag or a calcined clay
# has nowhere to go but the AFm/AFt phases, and the aluminum balance of the
# paste comes out wrong. `CNASH_ss` carries both the Al and the alkalis in the
# C-S-H structure, which is what the pozzolanic reaction actually produces.
#
# !! DO NOT DECLARE THIS ALONGSIDE `CSHQ` OR THE `ECSH` FAMILY !!
#
# The three are three descriptions of the same gel, not three phases, and
# declaring two of them counts the same calcium silicate hydrate twice. The
# overlap is exact rather than approximate: `KSiOH` (a CSHQ end-member),
# `ECSH1-KSH` and `ECSH2-KSH` all carry the formula ((KOH)2.5SiO2H2O)0.2 — the
# same substance under three names. `ChemicalSystem` refuses a system in which
# two declared solid solutions share a composition, and names the pair. That
# test cannot see `CSHQ` with `CNASH_ss`, which share no composition; since
# 0.25.1 the models listed in data/gel_models.toml are refused in pairs too.
#
# The mixing is Myers' own: ideal on six sites of the chain and interlayer
# (their Eq. 15), not ideal between the eight end-members. The site occupancy
# and the formula of each end-member are read from data/literature/Myers2014.json
# by `sublattice_model`, which checks each formula against the database record.
# Two of the end-members, 5CA and T5C*, hold no species of their own on any
# site, so their activities stay finite as they vanish: they can be absent from
# a gel that is present. The element balance fixes only five combinations of
# the eight amounts; the mixing energy, strictly convex (its occupancy matrix
# has rank 8), fixes the rest.
[[solid_solution]]
name        = "CNASH_ss"
end_members = ["T2C-CNASHss", "T5C-CNASHss", "TobH-CNASHss",
               "5CA", "5CNA", "INFCA", "INFCN", "INFCNA"]
model       = "sublattice"
sublattice  = "Myers2014:cnash"
source      = "Myers2014"

# ── CASH+ model of C-S-H — 6 or 12 end-members, compound energy formalism ────
#
# Sources
#   Kulik2022 : Kulik, Miron & Lothenbach, "A structurally-consistent CASH+
#               sublattice solid solution model for fully hydrated C-S-H
#               phases: Thermodynamic basis, methods, and Ca-Si-H2O core
#               sub-model", Cement and Concrete Research 151 (2022) 106585,
#               doi:10.1016/j.cemconres.2021.106585
#   Miron2022a: Miron, Kulik, Yan, Tits & Lothenbach, "Extensions of CASH+
#               thermodynamic solid solution model for the uptake of alkali
#               metals and alkaline earth metals in C-S-H", Cement and Concrete
#               Research 152 (2022) 106667, doi:10.1016/j.cemconres.2021.106667
#   Miron2022b: Miron, Kulik & Lothenbach, "Porewater compositions of Portland
#               cement with and without silica fume calculated using the
#               fine-tuned CASH+NK solid solution model", Materials and
#               Structures 55 (2022) 212, doi:10.1617/s11527-022-02045-0
#
# The C-S-H of the Ca-Si-H2O system on two mixing sites: the bridging tetrahedron
# (a silicate, a vacancy or a calcium) and the interlayer cation (a vacancy or a
# calcium), with the reference surface and the site interactions of the compound
# energy formalism. The six end-members are every compound of the two sites; the
# Gibbs energy depends on the site fractions alone, so their amounts are not
# unique and only the site fractions are. `CASH+` is the core model, for a system
# without alkalis; `CASH+NK` adds sodium and potassium on the interlayer site,
# twelve end-members, with the TCNh and TCKh of Miron2022b fine-tuned for cement
# pore solutions. The end-members are in the database cemdata18-cashplus.json
# alone, which also carries the CaSiO3@ complex the model was fitted with. A
# model of the C-S-H gel: declare one of the two, without CSHQ, CNASH_ss or the
# ECSH families (data/gel_models.toml).
[[solid_solution]]
name        = "CASH+"
end_members = ["TSvh", "TSCh", "Tvvh", "TCvh", "TvCh", "TCCh"]
model       = "compound_energy"
sublattice  = "Kulik2022:cashplus"
database    = "cemdata18-cashplus.json"
source      = "Kulik2022"

[[solid_solution]]
name        = "CASH+NK"
end_members = ["TSvh", "TSCh", "Tvvh", "TCvh", "TvCh", "TCCh",
               "TSNh", "TvNh", "TCNh", "TSKh", "TvKh", "TCKh"]
model       = "compound_energy"
sublattice  = "Miron2022a:cashplus_nk"
database    = "cemdata18-cashplus.json"
source      = "Miron2022a"

# The same model extended to lithium, rubidium, cesium, magnesium, strontium,
# barium and radium on the interlayer site (Miron2022a): 33 end-members, every
# compound of the two sites, with the 55 interaction parameters of Table A3.
[[solid_solution]]
name        = "CASH+ext"
end_members = ["TSvh", "Tvvh", "TCvh", "TSCh", "TvCh", "TCCh",
               "TSNh", "TvNh", "TCNh", "TSKh", "TvKh", "TCKh",
               "TSLih", "TvLih", "TCLih", "TSRbh", "TvRbh", "TCRbh", "TSCsh", "TvCsh", "TCCsh",
               "TSMgh", "TvMgh", "TCMgh", "TSSrh", "TvSrh", "TCSrh", "TSBah", "TvBah", "TCBah",
               "TSRah", "TvRah", "TCRah"]
model       = "compound_energy"
sublattice  = "Miron2022a:cashplus_full"
database    = "cemdata18-cashplus.json"
source      = "Miron2022a"

