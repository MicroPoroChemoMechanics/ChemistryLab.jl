# Solid solution phases for ChemistryLab.jl
#
# Each [[solid_solution]] entry defines one SolidSolutionPhase:
#   name        – name of the phase
#   end_members – symbols of species in the database (must have AS_CRYSTAL)
#   model       – mixing model: "ideal" | "redlich_kister" | "regular"
#   a0, a1, a2  – Redlich-Kister parameters (J/mol), only for model = "redlich_kister"
#   w           – single interaction parameter (J/mol) of a binary "regular"
#   W           – full symmetric interaction matrix (J/mol), rows, for a
#                 multi-component "regular" solution of any arity
#   source      – literature reference
#
# Sources
#   Lothenbach2019 : Lothenbach et al., Cement and Concrete Research 115 (2019) 472-506
#   Lothenbach2015 : Lothenbach & Nonat, Cement and Concrete Research 78 (2015) 57-70
#
# NOTE — this file is not the CEMDATA18/GEM-Selektor phase model, and is not
# meant to be. `CSHQ` and `C3(AF)S0.84H` below match the GEMS phases of the same
# names, but `AFm`, `Hydrogarnet` and `Hydrotalcite` are deliberate alternatives:
# GEMS treats `monocarbonate`, `C3AH6`, `C3FH6` and `hydrotalcite` as *pure*
# phases, its AFm solid solution is `C4AH13` + `monosulphate12`, and its
# hydrotalcite solid solution (`hydrotalc-pyro`) is `Mg3AlC0.5OH` +
# `Mg3FeC0.5OH` at Mg:Al = 3. Anyone reproducing a GEMS result should declare
# the phases in the script rather than take this file wholesale.

# ── C-S-H gel (CSHQ) — 6 end-members, ideal mixing ───────────────────────────
# `KSiOH` = ((KOH)2.5SiO2H2O)0.2 and `NaSiOH` = ((NaOH)2.5SiO2H2O)0.2 are the
# alkali-uptake end-members of the CEMDATA18 CSHQ phase, and they are the
# mechanism that fixes the pore-solution pH of a real paste. In the reference
# GEM-Selektor run of a CEM I at w/c = 0.5 they hold 74 % of the total potassium
# and 90 % of the total sodium; leaving them out strands all of it in solution.
# They were absent here until 0.15.0 although both are fully parameterized in
# both shipped databases. Their records name their own sources as the GEMS keys
# `Lothenbach_ea_b:2012` and `Robie_Hem:1995`; the second is USGS Bulletin 2131
# (doi:10.3133/b2131), the first is ambiguous between two 2012 Cement and
# Concrete Research papers with Lothenbach as first author and the shipped
# database carries no reference list to settle it, so the parameters are cited
# to Cemdata18 itself (Lothenbach2019).
[[solid_solution]]
name        = "CSHQ"
end_members = ["CSHQ-TobD", "CSHQ-TobH", "CSHQ-JenH", "CSHQ-JenD",
               "KSiOH", "NaSiOH"]
model       = "ideal"
source      = "Lothenbach2015"

# ── Fe-siliceous hydrogarnet — binary ideal ──────────────────────────────────
# The GEMS `C3(AF)S0.84H` phase: the Al and Fe end-members of the siliceous
# hydrogarnet, which is where the iron of a CEM I ferrite phase ends up. It
# takes 0.0507 mol in the reference run, second only to the C-S-H and the
# portlandite among the aluminate/ferrite hydrates.
[[solid_solution]]
name        = "C3(AF)S0.84H"
end_members = ["C3AFS0.84H4.32", "C3FS0.84H4.32"]
model       = "ideal"
source      = "Lothenbach2019"

# ── AFm phases (monosulfate / monocarbonate) — binary Redlich-Kister ─────────
# The end-members were spelled "Ms" and "Mc", which exist in neither shipped
# database: cemdata18 names them "monosulphate12" and "monocarbonate". The phase
# was therefore skipped with a warning by `build_solid_solutions`, and being the
# only non-ideal entry, the Redlich-Kister path had no live case at all.
[[solid_solution]]
name        = "AFm"
end_members = ["monosulphate12", "monocarbonate"]
model       = "redlich_kister"
a0          = 3000.0   # J/mol
a1          = 500.0    # J/mol
a2          = 0.0      # J/mol
source      = "Lothenbach2019"

# ── Hydrogarnet (C3AH6 / C3FH6) — binary ideal ───────────────────────────────
[[solid_solution]]
name        = "Hydrogarnet"
end_members = ["C3AH6", "C3FH6"]
model       = "ideal"
source      = "Lothenbach2019"

# ── Ettringite solid solution ─────────────────────────────────────────────────
[[solid_solution]]
name        = "Ettringite_ss"
end_members = ["ettringite", "ettringite30"]
model       = "ideal"
source      = "Lothenbach2019"

# ── Hydrotalcite (OH/CO3) — binary ideal ─────────────────────────────────────
# Likewise "Ht_OH"/"Ht_CO3" exist in neither database. The pair below is the
# OH/CO3 couple at matching Mg:Al = 2, which is what a binary solid solution
# requires: hydrotalcite is Mg4Al2O7(H2O)10 and Mg2AlC0.5OH is
# Mg2Al(OH)6(CO3)0.5(H2O)2. The database also carries Mg3AlC0.5OH at Mg:Al = 3,
# which would not pair consistently.
[[solid_solution]]
name        = "Hydrotalcite"
end_members = ["hydrotalcite", "Mg2AlC0.5OH"]
model       = "ideal"
source      = "Lothenbach2019"

# ── The remaining CEMDATA18 solid solutions ──────────────────────────────────
#
# The five below complete the set of multi-end-member phases a GEM-Selektor
# CEMDATA18 run of a Portland cement is given. Their end-members are all in both
# shipped databases; what is **assumed** here is ideal mixing.
#
# Read that assumption as an assumption. CEMDATA18 documents non-ideal parameters
# for some of these, and they are not reproduced here because they could not be
# sourced with confidence — a mixing parameter written down from memory is worse
# than an ideal model honestly labelled. If you are reproducing a published
# result that depends on one of these phases being non-ideal, set the model
# yourself in the script (`SolidSolutionPhase(name, members; model = ...)`).
#
# Two things measured on a CEM I paste at w/c = 0.5, worth knowing before
# loading all of them:
#
#   * All five are UNDERSATURATED there — GEM-Selektor reports LogSI of -2.883
#     (straetlingite), -1.000 (SO4_OH_AFm), -0.032 (SO4_CO3_AFt), -9.981
#     (hydrotalc-pyro) and -3.784 (MSH). A binary ideal solid solution gains at
#     most log10(2) = 0.301 over its best pure end-member, so mixing cannot
#     bring any of them in, and leaving them out costs nothing on that problem.
#   * A solid solution whose every end-member sits at the solver's lower bound
#     is numerically awkward: the mole fractions, and hence the log-activity
#     terms, are indeterminate there. Reaktoro fails to converge when any single
#     one of these five is declared on that paste.
#
# GEMS also carries `OH_SO4_AFm` and `CO3_SO4_AFt`, which repeat `SO4_OH_AFm` and
# `SO4_CO3_AFt` with the two end-member roles swapped. That is how GEMS opens a
# miscibility gap — two identical binaries, so two immiscible compositions can
# coexist. It cannot be expressed here, or in Reaktoro, because a species belongs
# to exactly one phase; and it is inert unless the gap actually opens.

# Straetlingite, two hydration states (C2ASH8 / C2ASH7).
[[solid_solution]]
name        = "Straetlingite_ss"
end_members = ["straetlingite", "straetlingite7"]
model       = "ideal"
source      = "Lothenbach2019"

# AFm, the SO4/OH couple GEMS uses: monosulfate against C4AH13. Distinct from
# the `AFm` entry above, which is the SO4/CO3 couple.
[[solid_solution]]
name        = "AFm_SO4_OH"
end_members = ["C4AH13", "monosulphate12"]
model       = "ideal"
source      = "Lothenbach2019"

# AFt, the SO4/CO3 couple, normalised per mole of sulfate: `ettringite03_ss` is
# (SO4)Ca2Al0.6666667(OH)4(H2O)8.6666667, exactly ettringite/3, and
# `tricarboalu03` is its carbonate analog. Declaring this alongside
# `Ettringite_ss` double-counts the same aluminate sulfate — pick one.
[[solid_solution]]
name        = "AFt_SO4_CO3"
end_members = ["tricarboalu03", "ettringite03_ss"]
model       = "ideal"
source      = "Lothenbach2019"

# Hydrotalcite-pyroaurite, the Al/Fe couple at Mg:Al = 3. Distinct from the
# `Hydrotalcite` entry above, which is the OH/CO3 couple at Mg:Al = 2.
[[solid_solution]]
name        = "Hydrotalcite_AlFe"
end_members = ["Mg3AlC0.5OH", "Mg3FeC0.5OH"]
model       = "ideal"
source      = "Lothenbach2019"

# M-S-H, two Mg/Si ratios.
[[solid_solution]]
name        = "MSH"
end_members = ["M075SH", "M15SH"]
model       = "ideal"
source      = "Lothenbach2019"

# ── C-(N-)A-S-H — the alkali- and aluminum-bearing C-S-H ─────────────────────
#
# Sources
#   Myers2014 : Myers, Bernal & Provis, "A thermodynamic model for C-(N-)A-S-H
#               gel: CNASH_ss. Derivation and validation against experimental
#               data", Cement and Concrete Research 66 (2014) 27-47,
#               doi:10.1016/j.cemconres.2014.07.005
#
# This is the phase a blended cement needs and `CSHQ` cannot supply. CSHQ has no
# aluminum end-member at all, so the Al released by a slag or a calcined clay
# has nowhere to go but the AFm/AFt phases, and the aluminum balance of the
# paste comes out wrong. `CNASH_ss` carries both the Al and the alkalis in the
# C-S-H structure, which is what the pozzolanic reaction actually produces.
#
# !! DO NOT DECLARE THIS ALONGSIDE `CSHQ` OR THE `ECSH` FAMILY !!
#
# The three are three descriptions of the same gel, not three phases, and
# declaring two of them counts the same calcium silicate hydrate twice. The
# overlap is exact rather than approximate: `KSiOH` (a CSHQ end-member),
# `ECSH1-KSH` and `ECSH2-KSH` all carry the formula ((KOH)2.5SiO2H2O)0.2 — the
# same substance under three names. `ChemicalSystem` refuses a system in which
# two declared solid solutions share a composition, and names the pair.
#
# Known degeneracy, and it is real rather than a defect of the transcription:
# the eight end-members span a space of rank 5, because Myers' model carries
# site-occupancy constraints that an ideal eight-component mixture does not
# reproduce. The feasible set stays bounded, so a solve is well posed, but the
# individual end-member amounts are not determined by the element balance alone
# — only their combinations are. Read the total and the Ca/Si, Al/Si ratios,
# not the eight numbers one by one.
[[solid_solution]]
name        = "CNASH_ss"
end_members = ["T2C-CNASHss", "T5C-CNASHss", "TobH-CNASHss",
               "5CA", "5CNA", "INFCA", "INFCN", "INFCNA"]
model       = "ideal"
source      = "Myers2014"
