    <circle cx="163.5" cy="280.0" r="6" fill="#177567"/>
    <text x="157.5" y="308.0" font-size="17" fill="#177567" text-anchor="start" font-style="italic">I</text>
    <text x="168.0" y="313.1" font-size="11" fill="#177567" text-anchor="start">1</text>
    <circle cx="266.2" cy="280.0" r="6" fill="#996019"/>
    <text x="244.2" y="308.0" font-size="17" fill="#996019" text-anchor="start" font-style="italic">I</text>
    <text x="254.7" y="313.1" font-size="11" fill="#996019" text-anchor="start">2</text>
    <circle cx="370.4" cy="280.0" r="6" fill="#177567"/>
    <text x="382.4" y="308.0" font-size="17" fill="#177567" text-anchor="start" font-style="italic">I</text>
    <text x="392.9" y="313.1" font-size="11" fill="#177567" text-anchor="start">3</text>
    <text x="160.0" y="210.0" font-size="14" fill="#52667d" text-anchor="start">F > 0: the ions hold</text>
    <text x="160.0" y="228.0" font-size="14" fill="#52667d" text-anchor="start">more than I</text>
    <text x="100.0" y="395.0" font-size="14" fill="#52667d" text-anchor="start">F &lt; 0: less than I</text>
    <text x="296.2" y="358.0" font-size="15" fill="#996019" text-anchor="middle">the equilibrium</text>
    <text x="296.2" y="376.0" font-size="15" fill="#996019" text-anchor="middle">under the balances</text>
    <path d="M282.2 340.0L269.2 292.0" stroke="#996019" stroke-width="2" marker-end="url(#arrowo)"/>
    <path d="M363.7 150.0L363.7 420.0" stroke="#52667d" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="357.7" y="166.0" font-size="14" fill="#52667d" text-anchor="end">ceiling: 4 × range;</text>
    <text x="357.7" y="184.0" font-size="14" fill="#52667d" text-anchor="end">the third root lies above it</text>
    <path d="M450 105V520" stroke="#d4dce7" stroke-width="1.5"/>
    <text x="480" y="43" font-size="15" font-weight="700" letter-spacing="2" fill="#52667d">WHICH ROOT</text>
    <text x="480" y="70" font-size="16">What the inversion returns</text>
    <rect x="490" y="126" width="370" height="78" rx="10" fill="#ffffff" stroke="#d4dce7"/>
    <text x="505.0" y="150.0" font-size="15" fill="#52667d" text-anchor="start" font-weight="700">first root only</text>
    <text x="505.0" y="172.0" font-size="14" fill="#172b42" text-anchor="start">always I₁, the root above the dilute limit:</text>
    <text x="505.0" y="192.0" font-size="14" fill="#52667d" text-anchor="start">a balance may never close, no certificate</text>
    <rect x="490" y="218" width="370" height="78" rx="10" fill="#ffffff" stroke="#d4dce7"/>
    <text x="505.0" y="242.0" font-size="15" fill="#177567" text-anchor="start" font-weight="700">the rule used</text>
    <text x="505.0" y="264.0" font-size="14" fill="#172b42" text-anchor="start">the root of the branch the iterate is on,</text>
    <text x="505.0" y="284.0" font-size="14" fill="#52667d" text-anchor="start">below the ceiling: I₂ here, and the balances close</text>
    <rect x="490" y="310" width="370" height="78" rx="10" fill="#ffffff" stroke="#d4dce7"/>
    <text x="505.0" y="334.0" font-size="15" fill="#3664a0" text-anchor="start" font-weight="700">one root</text>
    <text x="505.0" y="356.0" font-size="14" fill="#172b42" text-anchor="start">the usual case: that root,</text>
    <text x="505.0" y="376.0" font-size="14" fill="#52667d" text-anchor="start">nothing to choose</text>
    <rect x="490" y="402" width="370" height="78" rx="10" fill="#ffffff" stroke="#d4dce7"/>
    <text x="505.0" y="426.0" font-size="15" fill="#996019" text-anchor="start" font-weight="700">limiting law</text>
    <text x="505.0" y="448.0" font-size="14" fill="#172b42" text-anchor="start">(no ion size): the first root, always:</text>
    <text x="505.0" y="468.0" font-size="14" fill="#52667d" text-anchor="start">past its range it is a runaway, not a branch</text>
    <rect x="40" y="484" width="820" height="46" rx="10" fill="#e8eef8"/>
    <text x="62.0" y="513.0" font-size="16" fill="#172b42" text-anchor="start">Sketch of F(ln I) = ln(½ Σ z² m(I)) − ln I, at fixed potentials of the elements.</text>
  </g>
</svg>
