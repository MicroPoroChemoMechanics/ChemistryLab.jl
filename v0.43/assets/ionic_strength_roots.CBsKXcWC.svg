<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">The ionic strength of a solution can have three roots</title>
  <desc id="desc">Left: a sketch of the function whose zero is the self-consistent ionic strength, against the logarithm of the ionic strength; with ions of high charge it can cross zero three times, and the equilibrium under the element balances may be the middle root. Right: the rule that chooses the root: the first one alone can miss the equilibrium; the root of the branch the current iterate is on, below a ceiling of four times the range of the model, finds it.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#52667d"/></marker>
    <marker id="arrowo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#996019"/></marker>
    <marker id="arrowg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#177567"/></marker>
  </defs>
  <rect width="900" height="560" rx="18" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172b42">
    <text x="36" y="43" font-size="15" font-weight="700" letter-spacing="2" fill="#52667d">THREE ROOTS</text>
    <text x="36" y="70" font-size="16">With highly charged ions, F can turn back</text>
    <path d="M90 420V140" stroke="#52667d" stroke-width="2"/>
    <path d="M90 160V140" stroke="#52667d" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M90 280.0H420" stroke="#52667d" stroke-width="2"/>
