<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc">
  <title id="title">Which transfers can cross a system boundary?</title>
  <desc id="desc">An open system permits matter, heat and work transfer. A closed system permits heat and work but not matter transfer. A closed adiabatic system permits work only. An isolated system permits none of the three transfers. Arrows show allowed transfers, not their actual direction or magnitude.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 7 3.5 0 7Z" fill="#52667d"/></marker>
  </defs>
  <rect width="900" height="610" rx="18" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172b42">
    <text x="36" y="43" font-size="15" font-weight="700" letter-spacing="2" fill="#52667d">CHOOSE THE SYSTEM BOUNDARY</text>
    <g transform="translate(30 68)">
      <rect width="410" height="225" rx="12" fill="white" stroke="#cad5e2"/>
      <text x="22" y="34" font-size="22" font-weight="700">Open</text>
      <rect x="225" y="59" width="162" height="143" rx="12" fill="#e8effa" stroke="#3664a0" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="306" y="136" text-anchor="middle" font-size="20">System</text>
      <g font-size="18" stroke-width="3">
        <text x="22" y="94" fill="#3664a0">Matter</text><path d="M120 88H256" stroke="#3664a0" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
        <text x="22" y="139" fill="#996019">Heat</text><path d="M120 133H256" stroke="#996019" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
        <text x="22" y="184" fill="#177567">Work</text><path d="M120 178H256" stroke="#177567" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      </g>
    </g>
    <g transform="translate(460 68)">
      <rect width="410" height="225" rx="12" fill="white" stroke="#cad5e2"/>
      <text x="22" y="34" font-size="22" font-weight="700">Closed</text>
      <rect x="225" y="59" width="162" height="143" rx="12" fill="#e8effa" stroke="#3664a0" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="306" y="136" text-anchor="middle" font-size="20">System</text>
      <g font-size="18" stroke-width="3">
        <text x="22" y="94" fill="#52667d">Matter</text><text x="120" y="94" font-size="16" fill="#52667d">blocked</text>
        <text x="22" y="139" fill="#996019">Heat</text><path d="M120 133H256" stroke="#996019" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
        <text x="22" y="184" fill="#177567">Work</text><path d="M120 178H256" stroke="#177567" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      </g>
    </g>
    <g transform="translate(30 313)">
      <rect width="410" height="225" rx="12" fill="white" stroke="#cad5e2"/>
      <text x="22" y="34" font-size="22" font-weight="700">Closed + adiabatic</text>
      <rect x="225" y="59" width="162" height="143" rx="12" fill="#e8effa" stroke="#3664a0" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="306" y="136" text-anchor="middle" font-size="20">System</text>
      <g font-size="18" stroke-width="3">
        <text x="22" y="94" fill="#52667d">Matter</text><text x="120" y="94" font-size="16" fill="#52667d">blocked</text>
        <text x="22" y="139" fill="#52667d">Heat</text><text x="120" y="139" font-size="16" fill="#52667d">blocked</text>
        <text x="22" y="184" fill="#177567">Work</text><path d="M120 178H256" stroke="#177567" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      </g>
    </g>
    <g transform="translate(460 313)">
      <rect width="410" height="225" rx="12" fill="white" stroke="#cad5e2"/>
      <text x="22" y="34" font-size="22" font-weight="700">Isolated</text>
      <rect x="225" y="59" width="162" height="143" rx="12" fill="#e8effa" stroke="#3664a0" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="306" y="136" text-anchor="middle" font-size="20">System</text>
      <g font-size="18" fill="#52667d">
        <text x="22" y="94">Matter</text><text x="120" y="94" font-size="16">blocked</text>
        <text x="22" y="139">Heat</text><text x="120" y="139" font-size="16">blocked</text>
        <text x="22" y="184">Work</text><text x="120" y="184" font-size="16">blocked</text>
      </g>
    </g>
    <text x="36" y="567" font-size="16" fill="#52667d">Arrows indicate allowed exchanges, in either direction; they do not imply a nonzero transfer.</text>
    <text x="36" y="590" font-size="16" fill="#52667d">Adiabatic alone constrains heat transfer; it does not specify whether matter can cross.</text>
  </g>
</svg>
