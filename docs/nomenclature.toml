# The symbols of the documentation's formulas: the page `nomenclature.md` lists
# them, and hovering an equation shows those it holds.
#
# One entry per meaning of a symbol.
#
#   tex       the symbol as the formulas write it, matched in their TeX source
#             (inside \ce{…}, \text{…} and \mathrm{…} nothing is matched);
#   label     how the page and the hint print it (HTML: <sub>, <sup>);
#   name      what it is;
#   unit      its unit ("1" for a number without one, "" when it varies);
#   constant  the name of a physical constant of ChemistryLab, whose value and
#             unit the page and the hint read from the library (see
#             docs/nomenclature.jl), never typed here;
#   pages     where this meaning holds: paths under docs/src, a folder ending
#             in "/" for all of its pages. An entry without `pages` holds on
#             every page where no entry of the same `tex` is scoped;
#   script    true for a subscript or superscript, matched only there;
#   group     the section of the page.
#
# A symbol with several meanings has at most one unscoped entry (a subscript and
# a symbol written alike count as two); the test test/docs_nomenclature.jl
# checks that, and that every page named exists.

